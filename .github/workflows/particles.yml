name: Complex particles

on:
  pull_request:
    paths: ['addons/godot360/**', 'tests/**', 'tools/package_addon.py', '.github/workflows/particles.yml']
  push:
    branches: [main]
    paths: ['addons/godot360/**', 'tests/**', 'tools/package_addon.py', '.github/workflows/particles.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: particles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  particles:
    name: ${{ matrix.method }} / Mesa
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        method: [gl_compatibility, forward_plus, mobile]
        include:
          - method: gl_compatibility
            driver: opengl3
            border: '0'
          - method: forward_plus
            driver: vulkan
            border: '0'
          - method: mobile
            driver: vulkan
            border: '12.5'
    env:
      GODOT_VERSION: 4.7.2
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install review tools
        run: |
          python -m pip install numpy pillow
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers libxrandr2 libxinerama1 libxcursor1 libxi6
          mkdir -p .godot360/ci-particles/tools
          curl --fail --location --retry 3 "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o .godot360/ci-particles/tools/godot.zip
          unzip -q .godot360/ci-particles/tools/godot.zip -d .godot360/ci-particles/tools
          chmod +x ".godot360/ci-particles/tools/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "GODOT=$PWD/.godot360/ci-particles/tools/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Freeze and verify the package
        run: |
          python tools/package_addon.py --output .godot360/ci-particles/candidate.zip
          python -m zipfile -e .godot360/ci-particles/candidate.zip .godot360/ci-particles/unpacked
          python .godot360/ci-particles/unpacked/tools/package_addon.py --verify .godot360/ci-particles/candidate.zip
      - name: Compare smoke and native trails
        env:
          REVIEW_METHOD: ${{ matrix.method }}
          REVIEW_DRIVER: ${{ matrix.driver }}
          REVIEW_BORDER: ${{ matrix.border }}
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          for icd in /usr/share/vulkan/icd.d/lvp*json; do export VK_DRIVER_FILES="$icd"; break; done
          test -f "$VK_DRIVER_FILES"
          for review in smoke trail; do
            xvfb-run -a -s '-screen 0 1400x900x24' python ".godot360/ci-particles/unpacked/tests/${review}_review.py" --godot "$GODOT" --ffmpeg "$(command -v ffmpeg)" --ffprobe "$(command -v ffprobe)" --method "$REVIEW_METHOD" --driver "$REVIEW_DRIVER" --border "$REVIEW_BORDER" --output ".godot360/ci-particles/$review"
          done
      - name: Retain review evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: complex-particles-${{ matrix.method }}
          retention-days: 14
          include-hidden-files: true
          path: |
            .godot360/ci-particles/candidate.json
            .godot360/ci-particles/**/*-review.json
            .godot360/ci-particles/**/comparison.jpg
            .godot360/ci-particles/**/*.log
            .godot360/ci-particles/**/report.json
            .godot360/ci-particles/**/smoke-samples.json
            .godot360/ci-particles/**/capture-settings.json
