name: Combined rendering

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: combined-${{ github.ref }}
  cancel-in-progress: true

jobs:
  combined:
    name: ${{ matrix.method }} / GI alpha history
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        method: [forward_plus, mobile]
    env:
      GODOT_VERSION: 4.7.2
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install review tools
        run: |
          python -m pip install -r requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers libxrandr2 libxinerama1 libxcursor1 libxi6
          mkdir -p .godot360/ci-combined/tools
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 30 --max-time 300 "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o .godot360/ci-combined/tools/godot.zip
          unzip -q .godot360/ci-combined/tools/godot.zip -d .godot360/ci-combined/tools
          chmod +x ".godot360/ci-combined/tools/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "GODOT=$PWD/.godot360/ci-combined/tools/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Freeze and verify the package
        run: |
          python tools/package_addon.py --output .godot360/ci-combined/candidate.zip
          python -m zipfile -e .godot360/ci-combined/candidate.zip .godot360/ci-combined/unpacked
          python .godot360/ci-combined/unpacked/tools/package_addon.py --verify .godot360/ci-combined/candidate.zip
      - name: Compare every source and decoded frame with independent worlds
        env:
          REVIEW_METHOD: ${{ matrix.method }}
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          for icd in /usr/share/vulkan/icd.d/lvp*json; do export VK_DRIVER_FILES="$icd"; break; done
          test -f "$VK_DRIVER_FILES"
          xvfb-run -a -s '-screen 0 1400x900x24' python .godot360/ci-combined/unpacked/tests/combined_review.py --godot "$GODOT" --ffmpeg "$(command -v ffmpeg)" --ffprobe "$(command -v ffprobe)" --method "$REVIEW_METHOD" --capture-timeout 1800 --output .godot360/ci-combined/review
      - name: Retain review evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: combined-${{ matrix.method }}
          retention-days: 14
          include-hidden-files: true
          path: |
            .godot360/ci-combined/candidate.json
            .godot360/ci-combined/review/combined-review.json
            .godot360/ci-combined/review/comparison.jpg
            .godot360/ci-combined/review/project/generated/**
            .godot360/ci-combined/review/**/*.log
            .godot360/ci-combined/review/**/report.json
            .godot360/ci-combined/review/**/lightmap-samples.json
            .godot360/ci-combined/review/**/combined-samples.json
            .godot360/ci-combined/review/**/temporal-samples.json
            .godot360/ci-combined/review/**/capture-settings.json
            .godot360/ci-combined/review/**/render-progress.json
            .godot360/ci-combined/review/**/capture-result.json
            .godot360/ci-combined/review/**/status.json
