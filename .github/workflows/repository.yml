name: Repository hygiene

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check the repository guard
        run: python -m unittest discover -s tests -p repository_review_checks.py
      - name: Check all source files and documentation
        run: python tools/repository_review.py --output .godot360/repository-review.json
      - name: Build and reproduce the addon archive
        run: |
          python tools/package_addon.py --output .godot360/candidate.zip
          python -m zipfile -e .godot360/candidate.zip .godot360/unpacked
          python .godot360/unpacked/tools/package_addon.py --verify .godot360/candidate.zip
          python .godot360/unpacked/tools/package_addon.py --output .godot360/rebuilt.zip
          cmp .godot360/candidate.zip .godot360/rebuilt.zip
