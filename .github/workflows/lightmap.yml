name: Baked LightmapGI

on:
  pull_request:
    paths: ['addons/godot360/**', 'tests/**', 'tools/package_addon.py', 'requirements-dev.txt', '.github/workflows/lightmap.yml']
  push:
    branches: [main]
    paths: ['addons/godot360/**', 'tests/**', 'tools/package_addon.py', 'requirements-dev.txt', '.github/workflows/lightmap.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightmap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lightmap:
    name: ${{ matrix.method }} / baked scene
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - method: forward_plus
            border: '0'
          - method: mobile
            border: '12.5'
          - method: gl_compatibility
            border: '0'
    env:
      GODOT_VERSION: 4.7.2
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install review tools
        run: |
          python -m pip install -r requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers libxrandr2 libxinerama1 libxcursor1 libxi6
          mkdir -p .godot360/ci-lightmap/tools
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 30 --max-time 300 "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o .godot360/ci-lightmap/tools/godot.zip
          unzip -q .godot360/ci-lightmap/tools/godot.zip -d .godot360/ci-lightmap/tools
          chmod +x ".godot360/ci-lightmap/tools/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "GODOT=$PWD/.godot360/ci-lightmap/tools/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Freeze and verify the package
        run: |
          python tools/package_addon.py --output .godot360/ci-lightmap/candidate.zip
          python -m zipfile -e .godot360/ci-lightmap/candidate.zip .godot360/ci-lightmap/unpacked
          python .godot360/ci-lightmap/unpacked/tools/package_addon.py --verify .godot360/ci-lightmap/candidate.zip
      - name: Bake in editor, reopen and compare every frame
        env:
          REVIEW_METHOD: ${{ matrix.method }}
          REVIEW_BORDER: ${{ matrix.border }}
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          for icd in /usr/share/vulkan/icd.d/lvp*json; do export VK_DRIVER_FILES="$icd"; break; done
          test -f "$VK_DRIVER_FILES"
          xvfb-run -a -s '-screen 0 1400x900x24' python .godot360/ci-lightmap/unpacked/tests/lightmap_review.py --godot "$GODOT" --ffmpeg "$(command -v ffmpeg)" --ffprobe "$(command -v ffprobe)" --method "$REVIEW_METHOD" --border "$REVIEW_BORDER" --capture-timeout 1200 --output .godot360/ci-lightmap/review
      - name: Retain review evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lightmap-${{ matrix.method }}
          retention-days: 14
          include-hidden-files: true
          path: |
            .godot360/ci-lightmap/candidate.json
            .godot360/ci-lightmap/review/lightmap-review.json
            .godot360/ci-lightmap/review/comparison.jpg
            .godot360/ci-lightmap/review/project/generated/**
            .godot360/ci-lightmap/review/**/*.log
            .godot360/ci-lightmap/review/**/report.json
            .godot360/ci-lightmap/review/**/lightmap-samples.json
            .godot360/ci-lightmap/review/**/temporal-samples.json
            .godot360/ci-lightmap/review/**/capture-settings.json
            .godot360/ci-lightmap/review/**/render-progress.json
            .godot360/ci-lightmap/review/**/capture-result.json
            .godot360/ci-lightmap/review/**/status.json
