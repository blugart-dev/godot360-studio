name: Bug report
description: Report a reproducible problem with Godot360 Studio.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "For sensitive reports, follow SECURITY.md. Review logs for private paths before attaching them."
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Addon version or commit, Godot version, OS, GPU, renderer/driver and FFmpeg/FFprobe versions.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and minimal scene
      description: Provide numbered steps and a small scene or recipe when possible. Include output resolution, FPS and audio mode.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Explain the difference. For visual problems, show the affected direction and frame time.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs and evidence
      description: Include relevant sanitized errors, report checks or screenshots. State whether Test 1 second reproduces the problem.
