name: Feature proposal
description: Describe a workflow Godot360 could improve.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Workflow and problem
      description: What are you trying to produce, and what currently prevents it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the result you want, relevant renderer/platform requirements and alternatives you have tried.
    validations:
      required: true
